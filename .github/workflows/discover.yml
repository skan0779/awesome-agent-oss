name: Discover

on:
  workflow_dispatch:
    inputs:
      min_stars:
        description: "Minimum repository star count"
        required: true
        default: "1000"
      per_page:
        description: "GitHub search results per query"
        required: true
        default: "30"
      max_pages:
        description: "Maximum GitHub search pages per topic and sort"
        required: true
        default: "1"
      sort:
        description: "GitHub search sort mode"
        required: true
        type: choice
        default: "most stars"
        options:
          - "most stars"
          - "most forks"
          - "recently updated"

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked

      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: >
          uv run awesome-agent-oss discover
          --min-stars "${{ inputs.min_stars }}"
          --per-page "${{ inputs.per_page }}"
          --max-pages "${{ inputs.max_pages }}"
          --sorts "${{ inputs.sort }}"
